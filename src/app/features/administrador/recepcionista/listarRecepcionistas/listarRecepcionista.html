<table mat-table [dataSource]="dataSource" *ngIf="dataSource.length">

  <ng-container matColumnDef="rut">
    <th mat-header-cell *matHeaderCellDef>RUT</th>
    <td mat-cell *matCellDef="let m">{{ m.rut_medico }}</td>
  </ng-container>

  <ng-container matColumnDef="nombres">
    <th mat-header-cell *matHeaderCellDef>Nombres</th>
    <td mat-cell *matCellDef="let m">{{ m.nombres }}</td>
  </ng-container>

  <ng-container matColumnDef="apellidos">
    <th mat-header-cell *matHeaderCellDef>Apellidos</th>
    <td mat-cell *matCellDef="let m">{{ m.apellidos }}</td>
  </ng-container>

  <ng-container matColumnDef="celular">
    <th mat-header-cell *matHeaderCellDef>Celular</th>
    <td mat-cell *matCellDef="let m">{{ m.celular }}</td>
  </ng-container>

  <ng-container matColumnDef="fecha_nacimiento">
    <th mat-header-cell *matHeaderCellDef>Fecha nacimiento</th>
    <td mat-cell *matCellDef="let m">{{ m.fecha_nacimiento | date:'dd-MM-yyyy' }}</td>
  </ng-container>

  <ng-container matColumnDef="direccion">
    <th mat-header-cell *matHeaderCellDef>Dirección</th>
    <td mat-cell *matCellDef="let m">{{ m.direccion }}</td>
  </ng-container>

  <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef>Acciones</th>
    <td mat-cell *matCellDef="let m">
      <button mat-stroked-button color="primary" (click)="editar(m)">
        <mat-icon>edit</mat-icon> Editar
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
